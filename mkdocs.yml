site_name: 衍微的知识库
site_url: https://hui-cd.github.io/wiki

nav:
  - 首页: index.md
  - 机器学习基础:
    - machine-learning-basics.md
    - kl-divergence.md
  - 深度学习:
    - transformer.md
    - flash-attention.md
    - infini-attention.md
  - 大模型训练:
    - llm-rl-algorithms.md
    - sft-vs-rlhf.md
    - deepspeed.md
    - quantization.md
  - 生成模型:
    - diffusion-model.md
    - flow-matching.md
    - vae.md
  - 推理优化:
    - pagedattention.md
  - 模型系列:
    - deepseek.md
    - qwen-series.md
  - 辉少项目:
    - gait.md
    - grpo-global.md
    - mcp-agent-project.md
    - projects-overview.md
  - 面试题:
    - llm-questions-2025.md
    - interview-notes-comprehensive.md
  - 外部资源:
    - external-blogs.md
  - 日志: log.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
