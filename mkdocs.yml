site_name: 衍微的知识库
site_url: https://hui-cd.github.io/wiki

nav:
  - 首页: index.md
  - 机器学习基础: topics/machine-learning.md
  - 深度学习: topics/deep-learning.md
  - 大模型训练: topics/llm-training.md
  - 生成模型: topics/generative-models.md
  - 推理优化: topics/inference-optimization.md
  - 模型系列: topics/model-series.md
  - 辉少项目: topics/projects.md
  - 外部资源: topics/external-resources.md
  - 日志: log.md

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
